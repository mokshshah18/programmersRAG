<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>programmersRAG: viewport check</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="viewport.css">
  <script type="module" src="viewport.js"></script>
</head>
<body>
  <!-- Development helper: shows the application in a frame of a chosen size and
       colour scheme, and lists elements that are wider than the frame. Open it
       from the mock server: /dev/viewport.html?w=360&h=740&scheme=dark -->
  <form class="bar" id="bar">
    <label for="width">Width</label>
    <input type="number" id="width" name="w" min="240" max="3840" step="1" value="360">
    <label for="height">Height</label>
    <input type="number" id="height" name="h" min="240" max="2160" step="1" value="740">
    <label for="scheme">Scheme</label>
    <select id="scheme" name="scheme">
      <option value="light">light</option>
      <option value="dark">dark</option>
    </select>
    <button type="submit">Apply</button>
    <button type="button" id="check">Check overflow</button>
    <output id="result" for="check" aria-live="polite"></output>
  </form>
  <div class="stage">
    <iframe id="frame" title="programmersRAG" src="../index.html"></iframe>
  </div>
</body>
</html>
